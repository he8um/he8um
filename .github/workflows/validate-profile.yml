name: Validate profile

on:
  pull_request:
    paths:
      - README.md
      - portfolio/**
      - assets/**
      - scripts/**
      - tests/**
      - package.json
      - .github/workflows/validate-profile.yml
  push:
    branches: [main]
    paths:
      - README.md
      - portfolio/**
      - assets/**
      - scripts/**
      - tests/**
      - package.json
      - .github/workflows/validate-profile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Validate profile
        run: npm run validate

      - name: Run tests
        run: npm test
