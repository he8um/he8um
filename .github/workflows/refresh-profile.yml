name: Refresh public profile metadata

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-metadata-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_BRANCH: automation/profile-refresh
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Prepare the automation branch without rewriting history
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/${BOT_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BOT_BRANCH}:refs/remotes/origin/${BOT_BRANCH}"
            git switch --create "${BOT_BRANCH}" --track "origin/${BOT_BRANCH}"
            git merge --no-edit origin/main
          else
            git switch --create "${BOT_BRANCH}" origin/main
          fi

      - name: Refresh verified public metadata and visuals
        run: npm run refresh

      - name: Validate refreshed output
        run: |
          npm run validate
          npm test

      - name: Detect profile changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- portfolio/public-metadata.json assets/brand assets/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push refresh
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/public-metadata.json assets/brand assets/generated
          git commit -m "chore(profile): refresh public portfolio metadata"
          git push origin "HEAD:${BOT_BRANCH}"

      - name: Open or update refresh pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          body="Automated weekly refresh of public repository metadata and deterministic local SVGs. Curated descriptions and maturity interpretations were not changed."
          number="$(gh pr list --head "${BOT_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create --base main --head "${BOT_BRANCH}" --title "chore(profile): refresh public portfolio metadata" --body "$body"
          else
            gh pr edit "$number" --title "chore(profile): refresh public portfolio metadata" --body "$body"
          fi
