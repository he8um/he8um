<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 252">
  <title id="title">Portfolio snapshot</title>
  <desc id="desc">6 featured projects, 4 released product lines, 10 maintained agent Skills, 14 active portfolio repositories, and 7 verified milestones.</desc>
  <style>
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#f0f6fc; }
    .muted { fill:#9da7b3; }
    .accent { fill:#f0443e; }
    .surface { fill:#161b22; stroke:#30363d; }
    .surface2 { fill:#21262d; stroke:#30363d; }
    .line { stroke:#30363d; }
    .accent-line { stroke:#f0443e; }
  </style>
  <rect width="1200" height="252" rx="24" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="52" font-size="25" font-weight="800">Portfolio Snapshot</text>
  <text x="28" y="78" font-size="15" class="muted">Governed counts derived from portfolio/projects.json and verified public metadata.</text>
  <rect x="28" y="98" width="208" height="126" rx="16" class="surface"/>
    <text x="48" y="158" font-size="38" font-weight="800" class="accent">6</text>
    <text x="48" y="192" font-size="13" font-weight="700">FEATURED PROJECTS</text>
  <rect x="260" y="98" width="208" height="126" rx="16" class="surface"/>
    <text x="280" y="158" font-size="38" font-weight="800" class="accent">4</text>
    <text x="280" y="192" font-size="13" font-weight="700">RELEASED PRODUCT LINES</text>
  <rect x="492" y="98" width="208" height="126" rx="16" class="surface"/>
    <text x="512" y="158" font-size="38" font-weight="800" class="accent">10</text>
    <text x="512" y="192" font-size="13" font-weight="700">MAINTAINED AGENT SKILLS</text>
  <rect x="724" y="98" width="208" height="126" rx="16" class="surface"/>
    <text x="744" y="158" font-size="38" font-weight="800" class="accent">14</text>
    <text x="744" y="192" font-size="13" font-weight="700">ACTIVE PORTFOLIO REPOS</text>
  <rect x="956" y="98" width="208" height="126" rx="16" class="surface"/>
    <text x="976" y="158" font-size="38" font-weight="800" class="accent">7</text>
    <text x="976" y="192" font-size="13" font-weight="700">VERIFIED MILESTONES</text>
</svg>
