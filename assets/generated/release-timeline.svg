<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 520">
  <title id="title">Public release and milestone timeline</title>
  <desc id="desc">2026-06-11: Daryaft, v1.12.0 stable. 2026-06-27: AirBridge, v0.1.0 public alpha. 2026-07-10: BranchDojo, v0.4.0 released. 2026-07-20: Marketing Maestro, v2 architecture milestone. 2026-07-21: Product Maestro, v1 source milestone. 2026-07-27: Software Architecture Maestro, v1 source milestone. 2026-08-03: OH MY PM, v0.6.1 stable</desc>
  <style>
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#f0f6fc; }
    .muted { fill:#9da7b3; }
    .accent { fill:#f0443e; }
    .surface { fill:#161b22; stroke:#30363d; }
    .surface2 { fill:#21262d; stroke:#30363d; }
    .line { stroke:#30363d; }
    .accent-line { stroke:#f0443e; }
  </style>
  <rect width="1200" height="520" rx="24" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="48" font-size="25" font-weight="800">Release &amp; Milestone Timeline</text>
  <text x="28" y="73" font-size="14" class="muted">Only public tags and named commits are included; routine commits are excluded.</text>
  <line x1="190" y1="104" x2="1135" y2="104" class="line" stroke-width="1"/>
