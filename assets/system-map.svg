<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 740">
  <title id="title">System map</title>
  <desc id="desc">Topology showing how product, operations, automation, data, AI and delivery connect across selected work.</desc>
  <style>
    :root {
      color-scheme: dark;
    }
    text {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      fill: #E7E4DD;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .muted { fill: #9CA3AF; }
    .dim { fill: #68717D; }
    .red { fill: #E33B32; }
    .cyan { fill: #7DD3D8; }
    .panel { fill: #111419; stroke: #303741; }
    .panel2 { fill: #171B22; stroke: #303741; }
    .hair { stroke: #303741; stroke-width: 1; fill: none; }
    .hair-soft { stroke: #222831; stroke-width: 1; fill: none; }
    .signal { stroke: #E33B32; stroke-width: 2; fill: none; }
    .cyan-line { stroke: #7DD3D8; stroke-width: 1.5; fill: none; }
    .label { font-size: 13px; letter-spacing: 2px; font-weight: 700; }
    .small { font-size: 14px; }
    .micro { font-size: 11px; letter-spacing: 1.4px; }
    .scan { animation: scan 7s ease-in-out infinite; }
    .pulse { animation: pulse 4.5s ease-in-out infinite; transform-origin: center; }
    .flow { stroke-dasharray: 4 10; animation: flow 8s linear infinite; }
    @keyframes scan {
      0%, 100% { transform: translateX(-80px); opacity: 0; }
      15%, 75% { opacity: .28; }
      50% { transform: translateX(1020px); opacity: .12; }
    }
    @keyframes pulse {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @keyframes flow {
      to { stroke-dashoffset: -120; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scan, .pulse, .flow { animation: none; }
    }
  </style>
  <rect width="1200" height="740" rx="0" fill="#090A0C"/>
  <path d="M0 44H1200M0 696H1200" class="hair-soft"/>
  <path d="M44 0V740M1156 0V740" class="hair-soft"/>
  
    
    <text x="64" y="72" class="mono micro red">03 / SYSTEM MAP</text>
    <path d="M64 86H284" class="signal"/>
  
    <text x="64" y="112" class="small muted">Connected systems, not isolated tasks. Public and private work is mapped by capability, not repository count.</text>
    <g transform="translate(0 20)">
      <path d="M600 120L340 280" class="hair flow"/><path d="M600 120L860 280" class="hair flow"/><path d="M340 280L450 470" class="hair flow"/><path d="M860 280L450 470" class="hair flow"/><path d="M860 280L750 470" class="hair flow"/><path d="M450 470L600 620" class="hair flow"/><path d="M750 470L600 620" class="hair flow"/><path d="M340 280L600 620" class="hair flow"/>
      
      <path d="M514 168L600 120M514 168L600 620" class="cyan-line" opacity=".45"/>
      <rect x="459" y="152" width="110" height="32" rx="16" fill="#090A0C" stroke="#7DD3D8"/>
      <text x="514" y="172" text-anchor="middle" class="mono micro cyan">BOXJA</text>
    
      <path d="M426 232L340 280M426 232L450 470" class="cyan-line" opacity=".45"/>
      <rect x="371" y="216" width="110" height="32" rx="16" fill="#090A0C" stroke="#7DD3D8"/>
      <text x="426" y="236" text-anchor="middle" class="mono micro cyan">DKM OPS</text>
    
      <path d="M364 518L450 470M364 518L860 280" class="cyan-line" opacity=".45"/>
      <rect x="309" y="502" width="110" height="32" rx="16" fill="#090A0C" stroke="#7DD3D8"/>
      <text x="364" y="522" text-anchor="middle" class="mono micro cyan">AIRBRIDGE</text>
    
      <path d="M836 422L750 470M836 422L600 620" class="cyan-line" opacity=".45"/>
      <rect x="781" y="406" width="110" height="32" rx="16" fill="#090A0C" stroke="#7DD3D8"/>
      <text x="836" y="426" text-anchor="middle" class="mono micro cyan">OH MY PM</text>
    
      <path d="M664 518L750 470M664 518L600 120" class="cyan-line" opacity=".45"/>
      <rect x="609" y="502" width="110" height="32" rx="16" fill="#090A0C" stroke="#7DD3D8"/>
      <text x="664" y="522" text-anchor="middle" class="mono micro cyan">MAESTRO</text>
    
      
    <g>
      <circle cx="600" cy="120" r="54" fill="#111419" stroke="#303741" stroke-width="2"/>
      <circle cx="600" cy="120" r="8" fill="#7DD3D8" class="pulse"/>
      <text x="600" y="198" text-anchor="middle" font-size="18" font-weight="800">Product</text>
    </g>
  
    <g>
      <circle cx="340" cy="280" r="54" fill="#111419" stroke="#E33B32" stroke-width="2"/>
      <circle cx="340" cy="280" r="8" fill="#E33B32" class="pulse"/>
      <text x="340" y="358" text-anchor="middle" font-size="18" font-weight="800">Operations</text>
    </g>
  
    <g>
      <circle cx="860" cy="280" r="54" fill="#111419" stroke="#303741" stroke-width="2"/>
      <circle cx="860" cy="280" r="8" fill="#7DD3D8" class="pulse"/>
      <text x="860" y="358" text-anchor="middle" font-size="18" font-weight="800">Automation</text>
    </g>
  
    <g>
      <circle cx="450" cy="470" r="54" fill="#111419" stroke="#303741" stroke-width="2"/>
      <circle cx="450" cy="470" r="8" fill="#7DD3D8" class="pulse"/>
      <text x="450" y="548" text-anchor="middle" font-size="18" font-weight="800">Data</text>
    </g>
  
    <g>
      <circle cx="750" cy="470" r="54" fill="#111419" stroke="#303741" stroke-width="2"/>
      <circle cx="750" cy="470" r="8" fill="#7DD3D8" class="pulse"/>
      <text x="750" y="548" text-anchor="middle" font-size="18" font-weight="800">AI</text>
    </g>
  
    <g>
      <circle cx="600" cy="620" r="54" fill="#111419" stroke="#303741" stroke-width="2"/>
      <circle cx="600" cy="620" r="8" fill="#7DD3D8" class="pulse"/>
      <text x="600" y="698" text-anchor="middle" font-size="18" font-weight="800">Delivery</text>
    </g>
  
    </g>
  
</svg>
