      </g>
    
      <g>
        <rect x="64" y="434" width="1072" height="68" rx="12" class="panel"/>
        <text x="94" y="462" class="mono micro red">OP-004</text>
        <text x="94" y="490" font-size="20" font-weight="800">XHESAM</text>
        <text x="330" y="462" class="mono micro muted">PERSONAL PRODUCT AND SYSTEMS PORTFOLIO</text>
        <text x="330" y="490" class="small muted">Public surface for product, operations, automation and system architecture work.</text>
        <circle cx="1016" cy="469" r="7" fill="#D6A84F" class="pulse"/>
        <text x="1036" y="474" class="mono micro">ITERATING</text>
