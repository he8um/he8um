<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 590">
  <title id="title">Current operations</title>
  <desc id="desc">Structured list of active operations and systems, generated from data/operations.json.</desc>
  <style>
    :root {
      color-scheme: dark;
    }
    text {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      fill: #E7E4DD;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .muted { fill: #9CA3AF; }
    .dim { fill: #68717D; }
    .red { fill: #E33B32; }
    .cyan { fill: #7DD3D8; }
    .panel { fill: #111419; stroke: #303741; }
    .panel2 { fill: #171B22; stroke: #303741; }
    .hair { stroke: #303741; stroke-width: 1; fill: none; }
    .hair-soft { stroke: #222831; stroke-width: 1; fill: none; }
    .signal { stroke: #E33B32; stroke-width: 2; fill: none; }
    .cyan-line { stroke: #7DD3D8; stroke-width: 1.5; fill: none; }
    .label { font-size: 13px; letter-spacing: 2px; font-weight: 700; }
    .small { font-size: 14px; }
    .micro { font-size: 11px; letter-spacing: 1.4px; }
    .scan { animation: scan 7s ease-in-out infinite; }
    .pulse { animation: pulse 4.5s ease-in-out infinite; transform-origin: center; }
    .flow { stroke-dasharray: 4 10; animation: flow 8s linear infinite; }
    @keyframes scan {
      0%, 100% { transform: translateX(-80px); opacity: 0; }
      15%, 75% { opacity: .28; }
      50% { transform: translateX(1020px); opacity: .12; }
    }
    @keyframes pulse {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @keyframes flow {
      to { stroke-dashoffset: -120; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scan, .pulse, .flow { animation: none; }
    }
  </style>
  <rect width="1200" height="590" rx="0" fill="#090A0C"/>
  <path d="M0 44H1200M0 546H1200" class="hair-soft"/>
  <path d="M44 0V590M1156 0V590" class="hair-soft"/>
  
    
    <text x="64" y="72" class="mono micro red">02 / CURRENT OPERATIONS</text>
    <path d="M64 86H284" class="signal"/>
  
